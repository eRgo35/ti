# Keeps the pinned GitHub Actions and the crates in Cargo.lock up to date.
# Actions in release.yml are generated by `dist generate` from
# [dist.github-action-commits] in dist-workspace.toml; see CLAUDE.md for how
# to apply a Dependabot PR that touches it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      crates:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
